<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Mass Family</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{--paper:#F4EFE4;--green:#1F4A3A;--ink:#111111;--hair:rgba(31,74,58,.28)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.6;min-height:100svh;display:grid;place-items:center;padding:40px}
main{text-align:center;max-width:34em}
.brand{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--green);margin-bottom:34px}
h1{font-size:1.15rem;font-weight:normal;letter-spacing:.06em;color:var(--ink);margin-bottom:12px}
p{font-size:.95rem;color:var(--green);margin-bottom:34px}
a{color:var(--green);text-decoration:none;font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid var(--green);padding-bottom:3px;position:relative}
a:focus-visible{outline:2px solid var(--green);outline-offset:4px}
a::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100%,44px);height:44px}
</style>
</head>
<body>
<main>
<div class="brand">Mass Family</div>
<h1>Page not found</h1>
<p>The page you requested does not exist.</p>
<a href="/">Return to the homepage</a>
</main>
</body>
